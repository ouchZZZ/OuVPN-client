name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: '12266719'
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Fetch sing-box for loopback integration tests
        shell: bash
        run: |
          file=sing-box-1.14.4-linux-amd64.tar.gz
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/SagerNet/sing-box/releases/download/v1.14.4/$file" \
            --output "$RUNNER_TEMP/$file"
          printf '%s  %s\n' '699a1b510aa4396b2176d32d1181920399ebf1e267835da6f3b598d0f7c24968' "$RUNNER_TEMP/$file" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/$file" -C "$RUNNER_TEMP"
          printf 'SING_BOX_TEST_BINARY=%s\n' "$RUNNER_TEMP/sing-box-1.14.4-linux-amd64/sing-box" >> "$GITHUB_ENV"

      - name: Run tests and assemble the debug APK
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug
