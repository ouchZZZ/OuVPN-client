plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.myvpn'
    compileSdk 34

    defaultConfig {
        applicationId 'com.example.myvpn'
        minSdk 26
        ndk { abiFilters 'arm64-v8a' }
        targetSdk 34
        versionCode 9
        versionName '1.2.5'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
    }
    sourceSets.main.jniLibs.srcDir "$buildDir/generated/singbox/jni"
    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
            keepDebugSymbols += ['**/libsingbox.so']
        }
    }
}

// Built from a verified upstream source module with the app-private Android TUN hook.
def nativeSources = rootProject.file('native/direct-tun')
def prepareSingBox = tasks.register('prepareSingBox', Exec) {
    inputs.files(new File(nativeSources, 'build.py'), new File(nativeSources, 'receive_android.go'))
    def exe = layout.buildDirectory.file('generated/singbox/jni/arm64-v8a/libsingbox.so')
    outputs.file(exe)
    commandLine 'python3', new File(nativeSources, 'build.py').absolutePath, exe.get().asFile.absolutePath
}

tasks.named('preBuild').configure { dependsOn(prepareSingBox) }

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    implementation 'com.wireguard.android:tunnel:1.0.20260102'
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
}
